<title>Itaporã Food+ ADM — Painel Administrativo</title>

<!-- Tailwind CSS, FontAwesome e Google Fonts (Inter) -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
  .admin-btn { min-height: 40px; line-height: 1; white-space: nowrap; letter-spacing: .01em; }
  .admin-btn[class*="!py-1"] { min-height: 32px; }
  .admin-btn:hover { transform: none; opacity: .9; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btns .admin-btn { min-width: 120px; }
  .admin-btn.light:hover { background: #e2e8f0; }
  [hidden] { display: none !important; }
  body { font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; background-color: #eef1f5; color: #0f172a; -webkit-tap-highlight-color: transparent; }
  .no-bar::-webkit-scrollbar { display: none; }
  .no-bar { scrollbar-width: none; }
  
  .admin-tab { white-space: nowrap; padding: 10px 18px; border-radius: 6px; background: #ffffff; border: 1px solid #e2e8f0; font-size: 13px; font-weight: 700; color: #475569; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .admin-tab:hover { background: #f8fafc; color: #0f172a; }
  .admin-tab.active { background: #1e3a8a; color: #ffffff; border-color: #1e3a8a; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25); }
  
  .admin-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; box-shadow: 0 4px 16px -8px rgba(15, 23, 42, 0.08); }
  .admin-input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; background: #ffffff; font-size: 14px; min-width: 0; outline: none; transition: border-color 0.2s; }
  .admin-input:focus { border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15); }
  .admin-label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.02em; }
  
  .admin-btn { padding: 10px 16px; border-radius: 6px; font-weight: 700; font-size: 13px; background: #1e3a8a; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; border: none; transition: all 0.15s; }
  .admin-btn:hover { opacity: 0.92; transform: translateY(-1px); }
  .admin-btn.dark { background: #0f172a; color: #ffffff; }
  .admin-btn.light { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
  .admin-btn.danger { background: #dc2626; color: #ffffff; }
  .admin-btn.success { background: #16a34a; color: #ffffff; }
  
  .admin-table-wrap { overflow-x: auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; }
  .admin-table { width: 100%; font-size: 13px; border-collapse: collapse; min-width: 680px; }
  .admin-table th, .admin-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
  .admin-table th { background: #f8fafc; color: #475569; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
  
  .cal { background: #ffffff; border-radius: 14px; padding: 12px; border: 1px solid #e2e8f0; }
  .ch { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .ch button { background: #f1f5f9; border-radius: 8px; width: 36px; height: 32px; font-weight: 700; }
  .cg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cg small { color: #64748b; font-weight: 700; font-size: 11px; }
  .cg button { height: 36px; border-radius: 8px; background: #f8fafc; font-weight: 600; font-size: 13px; }
  .cal.closed_dates .on { background: #dc2626 !important; color: #ffffff !important; }
  .cal.days .on { background: #16a34a !important; color: #ffffff !important; }
  .cg button.today { outline: 2px solid #f59e0b; }

  .bar { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin-top: 12px; }
  .bar i { flex: 1; background: #1e3a8a; border-radius: 4px 4px 0 0; min-height: 2px; }
</style>
</head>

function shrink(file, max) {
  return new Promise(res => {
    const i = new Image();
    i.onload = () => {
      const k = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement("canvas");
      c.width = i.width * k; c.height = i.height * k;
      c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
      c.toBlob(b => res(b), "image/webp", .8);
    };
    i.onerror = () => res(null);
    i.src = URL.createObjectURL(file);
  });
}

async function upload(file) {
  const b = await shrink(file, sb ? 1200 : 700);
  if (!b) { toast("Imagem inválida"); return null; }
  if (sb) {
    const p = crypto.randomUUID() + (b.type.includes("webp") ? ".webp" : ".png");
    const r = await sb.storage.from("fotos").upload(p, b, { contentType: b.type });
    if (r.error) { toast("Falha ao enviar a imagem"); return null; }
    return sb.storage.from("fotos").getPublicUrl(p).data.publicUrl;
  }
  return new Promise(res => {
    const f = new FileReader();
    f.onload = () => res(f.result);
    f.readAsDataURL(b);
  });
}

function csv(name, rows) {
  const t = "\ufeff" + rows.map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([t], { type: "text/csv" }));
  a.download = name;
  a.click();
}

async function go(t) {
  S.tab = t;
  document.querySelectorAll(".admin-tab").forEach(b => {
    b.classList.toggle("active", b.dataset.t == t);
  });
  $("v").innerHTML = '<div class="p-12 text-center text-slate-400 font-medium"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-700 mb-2"></i><p>Carregando dados...</p></div>';
  
  S.stores = await db.list("stores");
  S.ads = await db.list("ads");
  S.cli = await db.list("clients");
  const settings = await db.list("settings");
  S.cfg = Object.fromEntries(settings.map(x => [x.key, x.value]));

  $("statStores").textContent = S.stores.length;
  $("statAds").textContent = S.ads.filter(a => adState(a).c === "g").length;
  $("statCli").textContent = S.cli.length;

  let clicksTotal = 0;

  ({

  window.scrollTo(0, 0);
}

  const d = dayDiff(s.paid_until, today());

}

async function addCover(el) { const u = await upload(el.files[0]); if (u) { F.cover_url = u; drawPhotos(); } el.value = ""; }

async function saveStore() {
  if (!val("f_name")) return toast("Informe o nome do comércio");
  const hours = {};
  for (let d = 0; d < 7; d++) if ($("ho" + d).checked) {
    const a = $("ha" + d).value, b = $("hb" + d).value;
    if (!a || !b) return toast("Preencha o horário de " + DIAS[d]);
    hours[d] = [a, b];
  }

  const row = {
    name: val("f_name"), category: val("f_cat"), emoji: val("f_emoji") || null,
    description: val("f_desc") || null, icon_url: F.icon_url || null,
    menu: (F.menu || []).filter(m => (m.name || "").trim()),
    phone: nph(val("f_phone")) || null, address: val("f_addr") || null,
    neighborhood: val("f_neigh") || null, reference: val("f_ref") || null,
    maps_url: val("f_maps") || null, facebook: val("f_fb") || null,
    instagram: val("f_ig") || null, delivery_mode: val("f_dm"),
    fee: +val("f_fee") || 0, time_text: val("f_time") || null,
    hours, closed_dates: F.closed_dates, cover_url: F.cover_url || null,
    photos: F.photos, monthly_price: val("f_mp") === "" ? null : +val("f_mp"), paid_until: val("f_paid") || null, active: $("f_act").checked
  };

  if (F.id) row.id = F.id;
  const e = await db.save("stores", row);

  toast("Comércio salvo!"); closeForm(); vStores();

async function delItem(t, id, q) {
  if (!confirm(q)) return;
  const e = await db.del(t, id);
  if (e) return toast("Erro: " + e);
  toast("Registro excluído!"); closeForm();
  go(S.tab);
}

function calHtml(f) {
  const y = CM.getFullYear(), m = CM.getMonth(), first = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate(), sel = new Set(F[f] || []), t = today();
  let h = `<div class="cal ${f}"><div class="ch"><button onclick="cmv(-1,'${f}')">‹</button><b class="text-sm font-bold">${MESES[m]} ${y}</b><button onclick="cmv(1,'${f}')">›</button></div><div class="cg">${DIAS.map(d => `<small>${d[0]}</small>`).join("")}`;
  for (let i = 0; i < first; i++) h += "<span></span>";
  for (let i = 1; i <= n; i++) {
    const k = `${y}-${String(m + 1).padStart(2, "0")}-${String(i).padStart(2, "0")}`;
    h += `<button class="${sel.has(k) ? "on" : ""}${k == t ? " today" : ""}" onclick="tog('${f}','${k}')">${i}</button>`;
  }
  return h + `</div></div><p class="text-xs text-slate-500 mt-2">${f == "days" ? adInfo() : `${(F[f] || []).length} dia(s) selecionado(s)`}</p>`;
}
function cmv(d, f) { CM = new Date(CM.getFullYear(), CM.getMonth() + d, 1); $("calbox").innerHTML = calHtml(f); }
function tog(f, k) { const a = F[f] = F[f] || [], i = a.indexOf(k); i < 0 ? a.push(k) : a.splice(i, 1); a.sort(); $("calbox").innerHTML = calHtml(f); }
function adInfo() { const n = (F.days || []).length, p = +F.daily_price || 0; return `${n} dia(s) contratado(s) ${p ? `· Valor total: ${money(n * p)} (${money(p)}/dia)` : ""}`; }
const adDaily = a => (a.daily_price != null && a.daily_price !== "") ? +a.daily_price : (a.price && (a.days || []).length ? a.price / a.days.length : 0);
function setDaily(v) { F.daily_price = v === "" ? null : +v; $("calbox").innerHTML = calHtml("days"); }

function adState(a) { const t = today(), d = a.days || []; return d.includes(t) ? { t: "No ar hoje", c: "g" } : d.some(x => x > t) ? { t: "Agendado", c: "a" } : { t: "Finalizado", c: "" }; }

function drawPrev() {
  const p = $("pv"); if (!p) return;
  const v = F.video_url, u = img(F.image_url), c = $("pvc");
  p.style.backgroundImage = "none"; p.style.position = "relative"; p.style.overflow = "hidden";
  if (!v && !u) { p.innerHTML = "Prévia da Faixa (Proporção 4:1)"; if (c) c.style.display = "none"; return; }
  const bl = u ? `<img src="${esc(u)}" alt="" draggable="false" class="absolute inset-0 w-full h-full object-cover pointer-events-none" style="filter:blur(14px);transform:scale(1.3);opacity:.75">` : "";
  const m = v ? vidTag(v, "absolute inset-0 w-full h-full pointer-events-none", u).replace("<video ", `<video style="object-fit:contain" onloadedmetadata="pvApply()" `) : `<img src="${esc(u)}" alt="" draggable="false" class="absolute inset-0 w-full h-full pointer-events-none select-none" style="object-fit:contain" onload="pvApply()">`;
  p.innerHTML = `<div class="absolute inset-0 bg-black"></div>${bl}<div id="pvm" style="position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none">${m}</div>` +
    (v ? `<button type="button" class="admin-btn danger !text-[10px] !py-1 !px-2 absolute top-1 right-1" style="z-index:5" onclick="F.video_url=null;drawPrev()">Remover vídeo</button>` : "");
  if (c) c.style.display = "block";
  pvBind(); pvApply();
}
const PV = { min: 0.01, max: 8 };
/* Enquadramento: 100% = preencher a faixa (como sempre). A mídia é desenhada INTEIRA e o fator k a leva ao tamanho de
   "preencher"; assim, abaixo de 100% a arte aparece completa, sem corte automático. */
function fzK(e) {
  const p = e.parentElement, w = e.naturalWidth || e.videoWidth, h = e.naturalHeight || e.videoHeight;
  if (!p || !w || !h || !p.offsetWidth || !p.offsetHeight) return 0;
  const a = w / h, b = p.offsetWidth / p.offsetHeight; return Math.max(a / b, b / a);
}
function fz(e) { const d = e.dataset.fz.split(","), k = fzK(e); if (k) e.style.transform = `translate(${d[1]}%,${d[2]}%) scale(${d[0] * k})`; }
addEventListener("resize", () => document.querySelectorAll("[data-fz]").forEach(fz));
function pvApply() {
  const e = document.querySelector("#pvm video,#pvm img"); if (!e) return;
  const k = fzK(e);
  if (k && F.autoFit) { F.autoFit = false; F.z = Math.max(PV.min, 1 / k); F.px = 0; F.py = 0; }   /* mídia nova: aparece inteira, sem corte */
  if (k) e.style.transform = `translate(${F.px}%,${F.py}%) scale(${F.z * k})`;
  const z = $("pvz"); if (z) z.value = Math.round(F.z * 100);
  const t = $("pvzt"); if (t) t.textContent = Math.round(F.z * 100) + "%";
}
function pvZoomSlider(v) { F.z = Math.max(PV.min, Math.min(PV.max, v / 100)); pvApply(); }
function pvPreset(k) {
  if (k === "fill") { F.z = 1; F.px = 0; F.py = 0; return pvApply(); }
  const e = document.querySelector("#pvm video,#pvm img"), r = $("pvm").getBoundingClientRect();
  const w = e && (e.videoWidth || e.naturalWidth), h = e && (e.videoHeight || e.naturalHeight);
  if (!w || !h) return toast("Aguarde a mídia carregar e tente de novo");
  F.z = Math.max(PV.min, Math.min(r.width / w, r.height / h) / Math.max(r.width / w, r.height / h)); F.px = 0; F.py = 0; pvApply();  /* "Caber inteiro": a arte inteira dentro da faixa */
}
function pvBind() {
  const m = $("pvm"); if (!m) return;
  const P = new Map(); let pinch = null;
  const rect = () => m.getBoundingClientRect();
  const clampT = () => { F.px = Math.max(-300, Math.min(300, F.px)); F.py = Math.max(-300, Math.min(300, F.py)); };
  const toC = (x, y) => { const r = rect(); return [((x - r.left) / r.width - 0.5) * 100, ((y - r.top) / r.height - 0.5) * 100]; };
  const zoomAt = (nz, cx, cy) => {
    nz = Math.max(PV.min, Math.min(PV.max, nz)); const k = nz / F.z;
    F.px = cx - (cx - F.px) * k; F.py = cy - (cy - F.py) * k; F.z = nz; clampT(); pvApply();
  };
  m.addEventListener("pointerdown", e => {
    try { m.setPointerCapture(e.pointerId); } catch (x) { }
    P.set(e.pointerId, { x: e.clientX, y: e.clientY }); m.style.cursor = "grabbing";
    if (P.size === 2) { const [a, b] = [...P.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: F.z }; }
  });
  m.addEventListener("pointermove", e => {
    const o = P.get(e.pointerId); if (!o) return;
    if (P.size === 1) {
      const r = rect(); F.px += (e.clientX - o.x) / r.width * 100; F.py += (e.clientY - o.y) / r.height * 100; clampT();
      P.set(e.pointerId, { x: e.clientX, y: e.clientY }); pvApply();
    } else if (P.size === 2 && pinch) {
      P.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const [a, b] = [...P.values()], d = Math.hypot(a.x - b.x, a.y - b.y), [cx, cy] = toC((a.x + b.x) / 2, (a.y + b.y) / 2);
      zoomAt(pinch.z * d / pinch.d, cx, cy);
    }
  });
  const end = e => { P.delete(e.pointerId); pinch = null; if (!P.size) m.style.cursor = "grab"; };
  m.addEventListener("pointerup", end); m.addEventListener("pointercancel", end);
  m.addEventListener("wheel", e => { e.preventDefault(); const [cx, cy] = toC(e.clientX, e.clientY); zoomAt(F.z * Math.exp(-e.deltaY * 0.0015), cx, cy); }, { passive: false });
  m.addEventListener("dblclick", () => pvPreset("fill"));
}

async function uploadVideo(file) {
  if (file.size > 20 * 1024 * 1024) { toast("Vídeo muito grande (máx. 20 MB)"); return null; }
  if (!sb) { toast("Vídeos exigem o Supabase conectado (armazenamento local não comporta vídeo)"); return null; }
  const ext = (file.name.split(".").pop() || "mp4").toLowerCase().replace(/[^a-z0-9]/g, "");
  const p = crypto.randomUUID() + "." + (ext || "mp4");
  const r = await sb.storage.from("fotos").upload(p, file, { contentType: file.type || "video/mp4" });
  if (r.error) { toast("Falha ao enviar o vídeo"); return null; }
  return sb.storage.from("fotos").getPublicUrl(p).data.publicUrl;
}

  else { const u = await upload(f); if (u) { F.image_url = u; F.z = 1; F.px = 0; F.py = 0; F.autoFit = true; drawPrev(); } }
  el.value = "";
}

function addMonth(iso) {
  const [y, m, d] = iso.split("-").map(Number), last = new Date(y, m + 1, 0).getDate(), t = new Date(y, m, Math.min(d, last));
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
}
const ORIG = { store: ["Catálogo · mensalidades", "#1e3a8a"], ad: ["Anúncios", "#059669"], special: ["Anúncio especial", "#f59e0b"] };
const pct1 = x => x.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
function pieSvg(sl) {
  const nz = sl.filter(x => x.v > 0), tot = nz.reduce((a, x) => a + x.v, 0);
  if (!tot) return "";
  const C = 100, R = 92, P = (a, r) => (C + r * Math.cos(a)).toFixed(2) + " " + (C + r * Math.sin(a)).toFixed(2);
  let a0 = -Math.PI / 2, out = "";
  if (nz.length == 1) out = `<circle cx="100" cy="100" r="${R}" fill="${nz[0].c}" stroke="#fff" stroke-width="2"><title>${nz[0].n}: ${money(nz[0].v)} (100%)</title></circle><text x="100" y="106" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">100%</text>`;
  else nz.forEach(x => {
    const f = x.v / tot, a1 = a0 + f * Math.PI * 2, am = (a0 + a1) / 2;
    out += `<path d="M100 100 L${P(a0, R)} A${R} ${R} 0 ${f > .5 ? 1 : 0} 1 ${P(a1, R)} Z" fill="${x.c}" stroke="#fff" stroke-width="2"><title>${x.n}: ${money(x.v)} (${pct1(f * 100)})</title></path>`;
    if (f >= .07) out += `<text x="${(C + R * .62 * Math.cos(am)).toFixed(2)}" y="${(C + R * .62 * Math.sin(am) + 5).toFixed(2)}" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">${Math.round(f * 100)}%</text>`;
    a0 = a1;
  });
  return `<svg viewBox="0 0 200 200" class="w-full max-w-[250px] mx-auto" role="img" aria-label="Gráfico de pizza: recebido por origem">${out}</svg>`;
}

function payForm(kind, ref, amount) {
  const it = kind === "store" ? S.stores.find(x => String(x.id) === ref) : S.ads.find(x => String(x.id) === ref);
  const name = it ? (kind === "ad" ? (it.client || it.title) : kind === "special" ? it.title : it.name) : "";
  F = { kind, ref_id: ref, name };
  formShell("Registrar Pagamento", `
  <div class="space-y-4">
    <div class="p-3 bg-slate-50 rounded-md border border-slate-200"><p class="font-extrabold text-sm">${esc(name)}</p><p class="text-xs text-slate-500">${kind == "store" ? "Catálogo · mensalidade" : kind == "special" ? "Anúncio especial" : "Anúncio"}</p></div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div><label class="admin-label">Valor Recebido (R$)</label><input id="pg_v" type="number" step="0.01" min="0" class="admin-input" value="${amount || ""}"></div>
      <div><label class="admin-label">Data do Recebimento</label><input id="pg_d" type="date" class="admin-input" value="${today()}"></div>
    </div>
    <div><label class="admin-label">Observação (opcional)</label><input id="pg_o" class="admin-input" placeholder="Ex.: Pix, dinheiro..."></div>
    ${kind == "store" ? `<label class="flex items-center gap-2 font-bold text-slate-900 text-sm"><input id="pg_x" type="checkbox" checked class="w-5 h-5"> Prorrogar o vencimento da mensalidade em 1 mês</label>` : ""}
  </div>`, savePay, null);
}
async function savePay() {
  const v = +val("pg_v"), d = val("pg_d");
  if (!(v > 0)) return toast("Informe o valor recebido");
  if (!d) return toast("Informe a data do recebimento");
  const e = await db.save("payments", { kind: F.kind, ref_id: F.ref_id, ref_name: F.name, amount: v, paid_at: d, note: val("pg_o") || null });
  if (e) return toast("Erro: " + e);
  if (F.kind === "store" && $("pg_x") && $("pg_x").checked) {
    const s = S.stores.find(x => String(x.id) === F.ref_id);
    if (s) await db.save("stores", { ...s, paid_until: addMonth(s.paid_until && s.paid_until > d ? s.paid_until : d) });
  }
  S.fm = d.slice(0, 7);
  toast("Pagamento registrado!"); closeForm(); go(S.tab);
}
async function delPay(id) {
  if (!confirm("Excluir este pagamento do balanço?")) return;
  const e = await db.del("payments", id);
  if (e) return toast("Erro: " + e);
  toast("Pagamento excluído"); vFin();
}

async function saveCats() {

async function backup() {
  const o = {
    data: new Date().toISOString(),
    stores: await db.list("stores"),
    ads: await db.list("ads"),
    clients: await db.list("clients"),
    settings: await db.list("settings")
  };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(o, null, 2)], { type: "application/json" }));
  a.download = "backup-itaporafood-" + today() + ".json";
  a.click();
}

function restoreBackup(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.stores) DB.stores = d.stores;
      if (d.ads) DB.ads = d.ads;
      if (d.clients || d.profiles) DB.clients = d.clients || d.profiles;
      if (d.settings) DB.settings = d.settings;
      persist();
      toast("Backup restaurado!");
      go("overview");
    } catch (err) { alert("Arquivo JSON de backup inválido."); }
  };
  r.readAsText(f);
}

/* Modo demonstração (sem Supabase): login local de teste. Com Supabase, o login é real (Supabase Auth). */
const isMaster = (e,p) => !sb && e.trim().toLowerCase() === "demo@demo.com" && p === "demo123";
function togglePass(){const i=$("lg_pass"),s=i.type==="password";i.type=s?"text":"password";$("lg_eye").className="fa-solid "+(s?"fa-eye-slash":"fa-eye")}
const SALT="itapora-adm-v1", MASTER="master-session";
function sha256(s){const K=[];let n=2;for(let i=0;i<64;n++){let p=1;for(let d=2;d*d<=n;d++)if(n%d==0){p=0;break}if(p){K[i++]=(Math.pow(n,1/3)%1)*4294967296|0}}
let H=[];n=2;for(let i=0;i<8;n++){let p=1;for(let d=2;d*d<=n;d++)if(n%d==0){p=0;break}if(p)H[i++]=(Math.pow(n,.5)%1)*4294967296|0}
const b=Array.from(new TextEncoder().encode(s)),l=b.length*8;b.push(128);while(b.length%64!=56)b.push(0);
for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
const R=(x,c)=>(x>>>c)|(x<<(32-c));
for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];
for(let i=16;i<64;i++){const a=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),c=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+a+w[i-7]+c)|0}
let [a,c,d,e,f,g,hh,j]=H;
for(let i=0;i<64;i++){const t1=(j+(R(f,6)^R(f,11)^R(f,25))+((f&g)^(~f&hh))+K[i]+w[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&c)^(a&d)^(c&d)))|0;j=hh;hh=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0}
H=[H[0]+a|0,H[1]+c|0,H[2]+d|0,H[3]+e|0,H[4]+f|0,H[5]+g|0,H[6]+hh|0,H[7]+j|0]}
return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
const hx = async (e,p) => sha256(SALT+"|"+e.trim().toLowerCase()+"|"+p);
const admins = () => LS.g("adm_users") || [];
const saveAdmins = a => LS.s("adm_users", a);
async function doLogin(ev) {
  ev.preventDefault();
  const e = $("lg_email").value.trim().toLowerCase(), p = $("lg_pass").value;
  if (sb) {
    const r = await sb.auth.signInWithPassword({ email: e, password: p });
    if (r.error) { $("lg_err").textContent = "E-mail ou senha incorretos."; return; }
    const ok = await sb.from("admins").select("user_id").eq("user_id", r.data.user.id).maybeSingle();
    if (!ok.data) { await sb.auth.signOut(); $("lg_err").textContent = "Este usuário não é administrador."; return; }
    return enter({ email: e, master: true });
  }
  if (isMaster(e, p)) { sessionStorage.setItem("adm_sess", JSON.stringify({ h: MASTER, e: e })); return enter({ email: e, master: true }); }
  const hash = await hx(e, p), a = admins().find(x => x.email === e && x.hash === hash);
  if (!a) { $("lg_err").textContent = "E-mail ou senha incorretos."; return; }
  sessionStorage.setItem("adm_sess", JSON.stringify({ h: hash, e: e }));
  enter({ email: e });
}
function enter(u) { S.user = u; $("login").hidden = true; $("app").hidden = false; $("who").textContent = u.email; boot(); }
async function forgotPass() {
  const e = $("lg_email").value.trim().toLowerCase(), er = $("lg_err");
  if (!sb) { er.className = er.className.replace("text-emerald-600", "text-red-600"); er.textContent = "Recuperação disponível quando o Supabase estiver configurado."; return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { er.className = er.className.replace("text-emerald-600", "text-red-600"); er.textContent = "Digite seu e-mail acima e toque em Esqueci minha senha."; return; }
  const r = await sb.auth.resetPasswordForEmail(e, { redirectTo: location.origin + location.pathname });
  er.className = er.className.replace(/text-(red|emerald)-600/, r.error ? "text-red-600" : "text-emerald-600");
  er.textContent = r.error ? "Não foi possível enviar agora. Tente de novo em instantes." : "Se o e-mail for de um administrador, enviamos o link para criar uma nova senha.";
}

async function saveNewPass() {
  const a = $("np1").value, b = $("np2").value, er = $("np_err");
  if (a.length < 6) return er.textContent = "A senha precisa ter ao menos 6 caracteres.";

  const r = await sb.auth.updateUser({ password: a });
  if (r.error) return er.textContent = "Não foi possível salvar. Peça um novo link.";
  await sb.auth.signOut(); alert("Senha alterada! Entre com a nova senha."); location.href = location.pathname;
}

async function addAdmin() {
  const e = $("na_email").value.trim().toLowerCase(), p = $("na_pass").value;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return toast("Informe um e-mail válido.");
